    <h1>Contact</h1>
    <p>Un concert à proposer, une question, une commande de merch ? Écris-nous.</p>
    <p><a href="mailto:ziardbreakers@gmail.com">ziardbreakers@gmail.com</a></p>
    <p><a href="https://linktr.ee/ziard_breakers">linktr.ee/ziard_breakers</a></p>
  </div>
  <form name="contact" method="POST" action="merci.html" data-netlify="true" netlify-honeypot="bot-field">
    <input type="hidden" name="form-name" value="contact">
    <p class="trap"><label>Ne pas remplir <input name="bot-field"></label></p>
    <label for="nom">Nom</label>
    <input id="nom" name="nom" required autocomplete="name">
    <label for="email">Adresse e-mail</label>
    <input id="email" name="email" type="email" required autocomplete="email">
    <label for="message">Message</label>
    <textarea id="message" name="message" rows="6" required></textarea>
    <button class="btn" type="submit">Envoyer le message</button>
  </form>
</section>
